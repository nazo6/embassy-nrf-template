cargo-features = ["profile-rustflags"]

[package]
name = "embassy-nrf-template"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = { version = "0.7.6", features = [
  "critical-section-single-core",
  "inline-asm"
] }
cortex-m-rt = "0.7.5"
embassy-executor = { version = "0.10.0", features = [
  "executor-thread",
  "log",
  "platform-cortex-m"
] }
embassy-nrf = { version = "0.10.0", features = [
  "gpiote",
  "log",
  "nrf52840",
  "time",
  "time-driver-rtc1"
] }
embassy-time = "0.5.1"
embassy-usb-logger = "0.6.0"
embedded-hal-async = "1.0.0"
log = "0.4.29"
